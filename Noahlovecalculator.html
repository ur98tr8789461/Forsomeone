<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noah's Love Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0a0205;--pink:#ff2a7a;--pink-hover:#ff005d;--input:#17050c;--border:#330b1b;--text:#fff;--muted:#fca5a5}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;background:var(--bg);color:var(--text);font-family:Inter,sans-serif}
    .container{width:100%;max-width:600px;padding:50px 20px;display:flex;flex-direction:column;gap:20px}
    .animate-up{opacity:0;transform:translateY(30px);animation:up .6s cubic-bezier(.16,1,.3,1) forwards}
    .delay-1{animation-delay:.1s}.delay-2{animation-delay:.2s}.delay-3{animation-delay:.3s}.delay-4{animation-delay:.4s}.delay-5{animation-delay:.5s}
    @keyframes up{to{opacity:1;transform:translateY(0)}}
    @keyframes out{to{opacity:0;transform:translateY(-20px)}}
    @keyframes in{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .mode-selector{display:flex;padding:5px;margin-bottom:5px;border:1px solid var(--border);border-radius:12px;background:var(--input)}
    .mode-btn{flex:1;padding:12px;border:0;border-radius:8px;background:transparent;color:var(--muted);font:600 .95rem Inter;cursor:pointer;transition:.3s}
    .mode-btn.active{background:var(--pink);color:#fff;box-shadow:0 4px 15px #ff2a7a4d}
    h1{margin:10px 0 5px;font:800 2.5rem Montserrat;letter-spacing:-1px}
    .subtitle{margin-bottom:20px;color:var(--muted)}
    .names-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:10px}
    input,select{width:100%;padding:16px;border:1px solid var(--border);border-radius:12px;outline:0;background:var(--input);color:var(--text);font:1rem Inter;transition:.3s}
    input:focus,select:focus{border-color:var(--pink);box-shadow:0 0 15px #ff2a7a26;transform:translateY(-2px)}
    input::placeholder{color:#885c6f}
    .questions-list{display:flex;flex-direction:column;gap:24px;margin-bottom:20px}
    .question-item label{display:block;margin-bottom:10px;color:#ffb3d1;font-size:.95rem;font-weight:500}
    button.primary-btn{width:100%;padding:18px;margin-bottom:40px;border:0;border-radius:12px;background:var(--pink);color:#fff;font:600 1.1rem Inter;cursor:pointer;transition:.2s}
    button.primary-btn:hover:not(:disabled){background:var(--pink-hover);box-shadow:0 8px 25px #ff2a7a66}
    button.primary-btn:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}
    #loadingScreen,#resultsScreen{display:none;justify-content:center;align-items:center;height:80vh;text-align:center}
    .loading-pulse{animation:pulse 1.5s infinite}
    @keyframes pulse{50%{opacity:.6}}
    #loadingScreen h2{margin-bottom:25px;font:700 1.5rem Montserrat}
    .progress-wrap{width:100%;max-width:300px;height:8px;overflow:hidden;border-radius:8px;background:var(--input)}
    .progress{width:0;height:100%;border-radius:8px;background:var(--pink);box-shadow:0 0 10px var(--pink);transition:width 1.2s ease}
    .score-display{margin-bottom:10px;color:var(--pink);font:800 7rem/1 Montserrat;letter-spacing:-3px;text-shadow:0 10px 30px #ff2a7a4d}
    .score-title{margin-bottom:15px;font-size:2rem;font-weight:700}
    .score-desc{max-width:430px;color:var(--muted);font-size:1.1rem;line-height:1.6}
    .reset-btn{margin-top:40px;padding:14px 28px;border:1px solid var(--border);border-radius:12px;background:transparent;color:var(--muted);font:500 1rem Inter;cursor:pointer}
    .reset-btn:hover{border-color:var(--pink);background:var(--input);color:#fff}
    .error-msg{color:var(--pink);font-weight:700;text-align:center}
    @media(max-width:480px){.names-grid{grid-template-columns:1fr}.score-display{font-size:5rem}}
  </style>
</head>
<body>
  <main class="container" id="mainForm">
    <div class="mode-selector animate-up delay-1">
      <button id="btnCrush" class="mode-btn active" type="button" onclick="switchMode('crush')">Crush Chances</button>
      <button id="btnCouples" class="mode-btn" type="button" onclick="switchMode('couples')">Couple Compatibility</button>
    </div>
    <header class="animate-up delay-2">
      <h1>Noah's Love Calculator</h1>
      <p class="subtitle" id="subtitleText">Loading questions...</p>
    </header>
    <div class="names-grid animate-up delay-3">
      <input id="name1" type="text" placeholder="First name" autocomplete="off">
      <input id="name2" type="text" placeholder="Second name" autocomplete="off">
    </div>
    <div class="questions-list animate-up delay-4" id="questionsContainer"></div>
    <div class="error-msg" id="errorContainer" role="alert" aria-live="polite"></div>
    <button class="primary-btn animate-up delay-5" id="calcBtn" type="button" onclick="startCalculation()" disabled>Loading...</button>
  </main>

  <section class="container" id="loadingScreen" aria-live="polite">
    <h2 class="loading-pulse">Calculating answer score...</h2>
    <div class="progress-wrap"><div class="progress" id="progressBar"></div></div>
  </section>

  <section class="container" id="resultsScreen" aria-live="polite">
    <div class="score-display" id="finalScore">0%</div>
    <div class="score-title" id="scoreTitle">Result</div>
    <div class="score-desc" id="scoreDesc"></div>
    <button class="reset-btn" type="button" onclick="resetApp()">Calculate another</button>
  </section>

  <script>
    const QUESTIONS_URL = 'questions.json';
    let allQuizData;
    let currentMode = 'crush';
    let minimumScore = 0;
    let maximumScore = 0;

    document.addEventListener('DOMContentLoaded', loadQuestions);

    async function loadQuestions() {
      try {
        const response = await fetch(QUESTIONS_URL);
        if (!response.ok) throw new Error('The questions file could not be loaded.');
        allQuizData = await response.json();
        loadMode(currentMode);
        const button = document.getElementById('calcBtn');
        button.disabled = false;
        button.textContent = 'Analyze answers';
      } catch (error) {
        console.error(error);
        document.getElementById('subtitleText').textContent = 'Questions unavailable.';
        showError(error.message);
      }
    }

    function switchMode(mode) {
      if (!allQuizData || mode === currentMode) return;
      currentMode = mode;
      document.getElementById('btnCrush').classList.toggle('active', mode === 'crush');
      document.getElementById('btnCouples').classList.toggle('active', mode === 'couples');
      showError('');
      loadMode(mode);
    }

    function loadMode(mode) {
      const questions = allQuizData[mode];
      document.getElementById('subtitleText').textContent =
        `Answer all ${questions.length} questions for a reflection score.`;

      minimumScore = questions.reduce((sum, item) =>
        sum + Math.min(...item.opts.map(option => Number(option.v))), 0);
      maximumScore = questions.reduce((sum, item) =>
        sum + Math.max(...item.opts.map(option => Number(option.v))), 0);

      const container = document.getElementById('questionsContainer');
      container.replaceChildren();
      questions.forEach((item, index) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'question-item';

        const label = document.createElement('label');
        label.htmlFor = `question-${index}`;
        label.textContent = `${index + 1}. ${item.q}`;

        const select = document.createElement('select');
        select.id = `question-${index}`;
        select.className = 'score-dropdown';
        select.required = true;

        const prompt = document.createElement('option');
        prompt.value = '';
        prompt.textContent = 'Select an answer';
        prompt.disabled = true;
        prompt.selected = true;
        select.appendChild(prompt);

        item.opts.forEach(itemOption => {
          const option = document.createElement('option');
          option.value = itemOption.v;
          option.textContent = itemOption.t;
          select.appendChild(option);
        });
        wrapper.append(label, select);
        container.appendChild(wrapper);
      });
    }

    function showError(message) {
      document.getElementById('errorContainer').textContent = message;
    }

    function startCalculation() {
      const firstName = document.getElementById('name1').value.trim();
      const secondName = document.getElementById('name2').value.trim();
      const answers = [...document.querySelectorAll('.score-dropdown')];

      if (!firstName || !secondName) {
        showError('Please enter both names. Names label the result but do not affect its score.');
        return;
      }
      const unanswered = answers.find(select => select.value === '');
      if (unanswered) {
        showError('Please answer every question before calculating.');
        unanswered.focus();
        return;
      }

      showError('');
      const rawScore = answers.reduce((sum, select) => sum + Number(select.value), 0);
      const range = maximumScore - minimumScore;
      const percentage = range > 0
        ? Math.round(((rawScore - minimumScore) / range) * 100)
        : 50;

      document.getElementById('calcBtn').disabled = true;
      switchScreen('mainForm', 'loadingScreen', () => {
        requestAnimationFrame(() => document.getElementById('progressBar').style.width = '100%');
        setTimeout(() => showResult(percentage), 1300);
      });
    }

    function showResult(score) {
      const result = resultCopy(score);
      document.getElementById('scoreTitle').textContent = result.title;
      document.getElementById('scoreDesc').textContent = result.description;
      switchScreen('loadingScreen', 'resultsScreen', () => animateScore(score));
    }

    function resultCopy(score) {
      const subject = currentMode === 'crush' ? 'the reported signals' : 'your reported compatibility';
      if (score >= 80) return {
        title: 'Strong indicators',
        description: `Your answers rate ${subject} highly. This is a reflection tool, not proof of another person's feelings or a prediction of the future.`
      };
      if (score >= 60) return {
        title: 'Several positive indicators',
        description: `Your answers suggest encouraging areas alongside some uncertainty. Honest, respectful communication is more reliable than a quiz.`
      };
      if (score >= 40) return {
        title: 'Mixed indicators',
        description: `Your answers are mixed. Avoid assumptions and consider direct, pressure-free communication and clear boundaries.`
      };
      return {
        title: 'Limited indicators',
        description: `Your answers currently show few positive indicators. Respect boundaries and do not treat this score as a judgment of either person.`
      };
    }

    function switchScreen(oldId, newId, callback) {
      const oldScreen = document.getElementById(oldId);
      const newScreen = document.getElementById(newId);
      oldScreen.style.animation = 'out .4s forwards';
      setTimeout(() => {
        oldScreen.style.display = 'none';
        oldScreen.style.animation = '';
        newScreen.style.display = 'flex';
        newScreen.style.animation = 'in .4s forwards';
        if (callback) callback();
      }, 400);
    }

    function animateScore(finalValue) {
      const element = document.getElementById('finalScore');
      const started = performance.now();
      element.textContent = '0%';
      function frame(now) {
        const progress = Math.min((now - started) / 1000, 1);
        element.textContent = `${Math.round((1 - Math.pow(1 - progress, 4)) * finalValue)}%`;
        if (progress < 1) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    function resetApp() {
      switchScreen('resultsScreen', 'mainForm', () => {
        const button = document.getElementById('calcBtn');
        button.disabled = false;
        button.textContent = 'Analyze answers';
        document.getElementById('progressBar').style.width = '0';
        document.getElementById('name1').value = '';
        document.getElementById('name2').value = '';
        document.querySelectorAll('.score-dropdown').forEach(select => select.value = '');
        showError('');
        window.scrollTo({top: 0, behavior: 'smooth'});
      });
    }
  </script>
</body>
</html>
